<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Qo'llanmalar</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b1b1f;--mut:#5d6068;--acc:#ff5026;--line:#e6e8ec;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#16171a;--card:#202226;--ink:#f1f1f3;--mut:#a5a8b0;--line:#33363c;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito","Segoe UI",system-ui,sans-serif;line-height:1.5}
main{max-width:720px;margin:0 auto;padding:40px 16px 48px}
h1{font-size:clamp(26px,5vw,40px);margin:0 0 6px;line-height:1.15}
header p{margin:0 0 24px;color:var(--mut);font-size:18px}
ul{list-style:none;margin:0;padding:0;display:grid;gap:12px}
a{display:flex;align-items:center;gap:14px;padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:16px;color:inherit;text-decoration:none;font-size:18px;font-weight:700;transition:border-color .15s}
a:hover,a:focus-visible{border-color:var(--acc)}
.n{flex:none;display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;background:var(--acc);color:#fff;font-weight:800}
</style>
</head>
<body>
<main>
<header><h1>Qo'llanmalar</h1><p>Kerakli qo'llanmani tanlang</p></header>
<ul>
<li><a href="/dars-jadvali"><span class="n">1</span>Dars jadvalini ko'rish</a></li>
<li><a href="/qoshimcha-dars"><span class="n">2</span>Qo'shimcha darsga yozilish</a></li>
<li><a href="/coinshop"><span class="n">3</span>CoinShop'dan sovg'a olish</a></li>
<li><a href="/referal"><span class="n">4</span>Do'stni taklif qilish</a></li>
<li><a href="/sertifikat"><span class="n">5</span>Sertifikatni ko'rish va yuklab olish</a></li>
</ul>
</main>
</body>
</html>
